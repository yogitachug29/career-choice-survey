<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Answer Submitted</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #fdf4ff
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            background: white;
            width: 90%;
            max-width: 550px;

            padding: 45px 30px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.10);
        }

        .check {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;

            margin-top: 20px;

            padding: 13px 25px;

            background: #4f46e5;
            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;
        }

        .button:hover {
            background: #4338ca;
        }

    </style>

</head>


<body>

    <div class="box">

        <div class="check">
            ✅
        </div>

        <h1>
            Answer Submitted!
        </h1>

        <p>
            Thank you for filling out the survey.
        </p>

        <p>
            Your answer has been saved successfully.
        </p>

        <a
            href="/"
            class="button"
        >
            Fill Another Response
        </a>

    </div>

</body>

</html>
